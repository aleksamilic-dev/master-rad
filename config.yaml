  model_size: medium
  sample_rate: 16000  # Whisper očekuje tačno 16 kHz
  silence_threshold: 0.005
groq:
  api_key: "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"  # Add your Groq API key here, or set GROQ_API_KEY environment variable
  model: whisper-large-v3-turbo  # whisper-large-v3-turbo (najbrži) ili whisper-large-v3
